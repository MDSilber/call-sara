[project]
name = "sara"
version = "1.0.0"
description = "Call Sara's ingestion engine: canonical statement models, source mappers (OFX, Chase CSV, Plaid), and the single audited ledger writer."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7,<3",
    # Pinned to the current major: Plaid ships breaking majors frequently and
    # the sync/investments surface this package uses is generated per-major.
    "plaid-python>=42,<43",
    # The classifier's model tier (sara/classify.py). Imported lazily and only
    # when $VAULT/.secrets/anthropic.env provides a key — tiers 1-2 never
    # touch it, so an older venv without it still runs everything else.
    "anthropic>=0.40,<1",
]

[project.optional-dependencies]
# The local Sara App server (python -m sara.server): FastAPI assembles the
# existing report builders into JSON; uvicorn serves it on 127.0.0.1 only.
app = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]
# The analytics shadow (sara/analytics.py): exports the ledger to a
# disposable reports/analytics.duckdb + parquet twins. duckdb is pinned to
# the current major — its storage format still churns between majors, which
# is fine ONLY because the file is a regenerated cache, never an archive.
analytics = [
    "duckdb>=1.5,<2",
    "beancount>=3,<4",   # the in-process loader (vault venvs already have it)
]
dev = [
    "pytest>=8",
    "hypothesis>=6",
    "pyright>=1.1.400",
    "ruff>=0.14",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "httpx>=0.27",       # FastAPI TestClient transport
    "duckdb>=1.5,<2",    # keep in lockstep with [analytics]
    "beancount>=3,<4",
]

[project.scripts]
sara-ingest = "sara.ingest:main"
sara-link = "sara.link:main"
sara-analytics = "sara.analytics:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sara"]

[tool.pyright]
# server contract tests exercise untyped TestClient/json boundaries; they get
# basic checking while sara/ and all other tests stay strict-zero
executionEnvironments = [
  { root = "tests/test_server_app.py", typeCheckingMode = "basic" },
]
include = ["sara", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.11"
# sara.server assembles the report builders in skills/finance/tools/ — flat
# modules imported by name once the server package puts that dir on sys.path.
extraPaths = ["../tools"]
# plaid-python is generated OpenAPI code without a py.typed marker; the two
# modules that touch it confine every value to a typed boundary immediately.
reportMissingTypeStubs = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",  # long lines: ported report strings keep their exact wording
]

# the finance tools (vault, home, webview, checks, …) are first-party flat
# modules living in ../tools; keep isort from filing them as third-party
[tool.ruff.lint.isort]
known-first-party = [
    "allocation", "checks", "dismissals", "forecast", "home", "importers",
    "reports", "vault", "webview",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
