[project]
name = "sara"
version = "1.0.0"
description = "Call Sara's ingestion engine: canonical statement models, source mappers (OFX, Chase CSV, Plaid), and the single audited ledger writer."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7,<3",
    # Pinned to the current major: Plaid ships breaking majors frequently and
    # the sync/investments surface this package uses is generated per-major.
    "plaid-python>=42,<43",
    # The classifier's model tier (sara/classify.py). Imported lazily and only
    # when $VAULT/.secrets/anthropic.env provides a key — tiers 1-2 never
    # touch it, so an older venv without it still runs everything else.
    "anthropic>=0.40,<1",
]

[project.optional-dependencies]
# The local Sara App server (python -m sara.server): FastAPI assembles the
# existing report builders into JSON; uvicorn serves it on 127.0.0.1 only.
app = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    # the CQRS read path: GET endpoints query reports/analytics.duckdb
    # (read-only; the same pinned major as [analytics] — one cache format)
    "duckdb>=1.5,<2",
    # FastAPI's multipart parser for the drag-drop upload action
    "python-multipart>=0.0.9,<1",
]
# The analytics shadow (sara/analytics.py): exports the ledger to a
# disposable reports/analytics.duckdb + parquet twins. duckdb is pinned to
# the current major — its storage format still churns between majors, which
# is fine ONLY because the file is a regenerated cache, never an archive.
analytics = [
    "duckdb>=1.5,<2",
    "beancount>=3,<4",   # the in-process loader (vault venvs already have it)
]
dev = [
    "pytest>=8",
    "hypothesis>=6",
    "pyright>=1.1.400",
    "ruff>=0.14",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "httpx>=0.27",       # FastAPI TestClient transport
    "duckdb>=1.5,<2",    # keep in lockstep with [analytics]
    "beancount>=3,<4",
    "python-multipart>=0.0.9,<1",
]

[project.scripts]
sara-ingest = "sara.ingest:main"
sara-link = "sara.link:main"
sara-analytics = "sara.analytics:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sara"]

[tool.pyright]
# The server contract tests exercise untyped TestClient/json boundaries; that
# one file declares `# pyright: basic` inline while sara/ and all other tests
# stay strict-zero.
include = ["sara", "tests", "tests_server"]
pythonVersion = "3.11"
# STAGED: sara/advisor arrived from the untyped tools/ layer on 2026-08-07
# (consolidation stage 1b, a behavior-preserving move) and is checked at
# "basic" until stage 1d brings it to strict + Decimal like the rest of the
# package — at which point `strict` becomes ["sara", "tests"] again and the
# ignore list disappears.
typeCheckingMode = "basic"
strict = ["sara/*.py", "sara/cli", "sara/ledger", "sara/sources", "sara/server", "sara/advisor/snapshot.py", "sara/advisor/run_checks.py", "sara/advisor/dismissals.py", "sara/advisor/documents.py", "sara/advisor/inbox.py", "sara/advisor/crosscheck.py", "sara/advisor/types.py", "tests"]
# plaid-python is generated OpenAPI code without a py.typed marker; the two
# modules that touch it confine every value to a typed boundary immediately.
reportMissingTypeStubs = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",  # long lines: ported report strings keep their exact wording
]

[tool.ruff.lint.isort]
known-first-party = ["sara"]

# STAGED with the pyright carve-out above: the moved advisor layer keeps its
# tools-era lint tolerance until stage 1d raises it to the package standard.
[tool.ruff.lint.per-file-ignores]
"sara/advisor/*" = ["E402", "I001", "UP", "B", "SIM", "RUF", "E7", "F841"]

[tool.pytest.ini_options]
testpaths = ["tests"]  # server contract tests: `pytest tests_server` (own session — one process binds one vault)
