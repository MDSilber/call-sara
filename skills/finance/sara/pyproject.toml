[project]
name = "sara"
version = "1.0.0"
description = "Call Sara's ingestion engine: canonical statement models, source mappers (OFX, Chase CSV, Plaid), and the single audited ledger writer."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7,<3",
    # Pinned to the current major: Plaid ships breaking majors frequently and
    # the sync/investments surface this package uses is generated per-major.
    "plaid-python>=42,<43",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "hypothesis>=6",
    "pyright>=1.1.400",
    "ruff>=0.14",
]

[project.scripts]
sara-ingest = "sara.ingest:main"
sara-link = "sara.link:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sara"]

[tool.pyright]
include = ["sara", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.11"
# plaid-python is generated OpenAPI code without a py.typed marker; the two
# modules that touch it confine every value to a typed boundary immediately.
reportMissingTypeStubs = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",  # long lines: ported report strings keep their exact wording
]

[tool.pytest.ini_options]
testpaths = ["tests"]
